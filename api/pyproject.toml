[project]
name = "api"
version= "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]